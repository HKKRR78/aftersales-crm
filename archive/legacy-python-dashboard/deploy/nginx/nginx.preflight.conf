worker_processes 1;

error_log /Users/Shared/ecom-profit/projects/crm/logs/crm_nginx_preflight.err.log info;
pid /Users/Shared/ecom-profit/projects/crm/runtime/crm_nginx_preflight.pid;

events {
    worker_connections 128;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;

    map $cookie_crm_canary $crm_upstream {
        default 127.0.0.1:8088;
        "1" 127.0.0.1:18089;
    }

    log_format crm_preflight '$remote_addr [$time_local] "$request" $status '
                             'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /Users/Shared/ecom-profit/projects/crm/logs/crm_nginx_preflight.access.log crm_preflight;

    server {
        listen 127.0.0.1:18090;
        server_name _;

        location / {
            proxy_pass http://$crm_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}

worker_processes 1;

error_log /Users/Shared/ecom-profit/projects/crm/logs/crm_nginx.err.log info;
pid /Users/Shared/ecom-profit/projects/crm/runtime/crm_nginx.pid;

events {
    worker_connections 256;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $cookie_crm_canary $crm_upstream {
        include /Users/Shared/ecom-profit/projects/crm/deploy/nginx/upstream-map.conf;
    }

    log_format crm '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /Users/Shared/ecom-profit/projects/crm/logs/crm_nginx.access.log crm;

    server {
        listen 0.0.0.0:8088;
        server_name _;

        location = /crm/canary/enable {
            add_header Set-Cookie "crm_canary=1; Path=/crm; Max-Age=86400; HttpOnly; SameSite=Lax";
            add_header Cache-Control "no-store";
            return 302 /crm;
        }

        location = /crm/canary/disable {
            add_header Set-Cookie "crm_canary=; Path=/crm; Max-Age=0; HttpOnly; SameSite=Lax";
            add_header Cache-Control "no-store";
            return 302 /crm;
        }

        location / {
            proxy_pass http://$crm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
